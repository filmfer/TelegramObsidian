services:
  telegram-agent:
    build: .
    container_name: obsidian-agent
    restart: unless-stopped
    env_file: ./.env
    volumes:
      # Mount Google Drive (or NFS) so the bot writes directly to the synced Vault
      - vault:/data/vault
    # No host ports exposed — the bot uses Telegram polling (outbound HTTPS only).
    # This minimizes the attack surface on the VPS.

volumes:
  vault: